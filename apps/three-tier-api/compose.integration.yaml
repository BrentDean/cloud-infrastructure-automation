services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD for integration tests}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.15.0-alpine
    command: ["--name", "labops-local"]

  api:
    build:
      context: .
    environment:
      PGHOST: postgres
      PGDATABASE: labdb
      PGUSER: labuser
      PGPASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD for integration tests}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:${API_TEST_PORT:-18080}:8000"

  worker:
    build:
      context: ../../services/event-worker
    environment:
      PGHOST: postgres
      PGDATABASE: labdb
      PGUSER: labuser
      PGPASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD for integration tests}
      PGSSLMODE: disable
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
