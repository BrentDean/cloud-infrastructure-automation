name: Shared Python API Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -r apps/three-tier-api/requirements.txt 'pytest>=8,<10'
      - name: Python contract tests
        working-directory: apps/three-tier-api
        run: python -m pytest -q tests
      - name: Validate shell script
        run: bash -n scripts/test-three-tier-api-container.sh
      - name: Isolated Docker Compose integration test
        run: bash scripts/test-three-tier-api-container.sh
